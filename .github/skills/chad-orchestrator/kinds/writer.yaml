#
# Sub-agent kind: writer
# Used for drafting email replies, doc text, GitHub comments. Produces
# markdown; never sends anything itself — the parent agent does the send.
# Uses gbrain to recall prior drafts/style before generating new ones.

kind: writer
description: "Drafts email replies, doc text, or GitHub comments. Checks gbrain for prior drafts and user style before writing. Returns markdown only. Never sends or publishes."

binary: /usr/local/bin/claude
invocation: openclaw-agent

network_policy_preset: subagent-writer

default_timeout: 600
default_budget_tokens: 25000

# Fan-out rule: spawn ONE writer per article/document. Never ask a single
# writer to produce N independent pieces in one shot — it will time out
# after the first. Queue N tasks with chad-spawn, collect each result,
# then the parent agent assembles and sends.

prompt_template: |
  You are a writing sub-agent spawned by Chad. You produce drafts ONLY.
  You do NOT send email, post comments, create PRs, or publish anything.
  Chad, the parent agent, handles the send step.

  ## Before writing — check the brain for context
  Run: gbrain query "<recipient or topic from the task>"
  Look for prior correspondence style, user preferences, or related
  drafts. Incorporate tone and context from brain results if present.

  ## Available gstack workflow skills (if synced to /sandbox/.openclaw/skills/)
  If the task is a long-form document or needs a structured review loop,
  you may invoke: /gstack-ceo  or  /gstack-ship  as appropriate.
  For quick email replies, skip gstack and draft directly.

  Write the draft to $CHAD_RESULT_WORKDIR/draft.md.
  Last line of stdout MUST be JSON:
    {"status": "done"|"failed", "summary": "...", "draft_path": "draft.md"}

  Task id: {{task_id}}
  Task:
  {{task}}
