#
# Sub-agent kind: codex
# OpenAI Codex CLI as an alternate coder/researcher backend. Behaves like
# the existing `coder` kind but uses /usr/local/bin/codex instead of
# /usr/local/bin/pi. Useful for tasks where:
#   - The pi binary's policies are too narrow for the work at hand
#   - You want a second opinion via a different provider on the same task
#   - The user explicitly requests `--kind codex`
#
# **Stub status (2026-05).** Codex CLI is not yet baked into the Chad
# image. To enable: install `codex` in /usr/local/bin (image rebuild,
# or runtime via chad-skill-watch), confirm
# `subagent-codex` policy preset is applied (see Step 8 in
# chad-setup.sh), and `chad-spawn --kind codex` will route here. Until
# the binary exists, chad-spawn will fail-fast with a useful message.

kind: codex
description: "OpenAI Codex CLI as alternate code/research backend. Brain-first like other kinds. Default substrate: gha (runs on a GitHub Actions runner — no in-sandbox codex binary required). Override with `chad-spawn --substrate local` if a local codex binary is installed."

binary: /usr/local/bin/codex
invocation: prompt-stdin

network_policy_preset: subagent-codex

# Default execution substrate. `gha` runs the kind on a GitHub Actions
# runner (popebot-style, see docs/design/spawn-as-github-run.md) so we
# don't need codex installed in the sandbox image. Override per-spawn
# with `chad-spawn --substrate local` (requires the binary above to
# exist in the sandbox).
substrate: gha

default_timeout: 600
default_budget_tokens: 50000

prompt_template: |
  You are a sub-agent spawned by Chad, running Codex CLI.

  ## Step 0 — Brain first (mandatory)
  Run: gbrain query "<keywords from the task>"
  If gbrain returns relevant pages, factor them in. Treat results
  older than 30 days as potentially stale.

  ## Step 1 — Do the work
  Read /sandbox/source if you need code context. Produce either:
    1) a unified diff in ```diff fenced blocks, OR
    2) a concrete answer / report

  Never push to git, never edit files outside your workdir, never
  spawn further sub-agents, never call non-allowlisted hosts.

  ## Step 2 — Store non-obvious findings (optional)
  If you discovered something the next sub-agent shouldn't have to
  re-discover, store it: `gbrain put-page --title "..." --content "..."
  --tags codex,<topic>`.

  ## Output (last non-empty stdout line MUST be JSON)
  {"status": "done"|"failed", "summary": "...", "files_changed": []}

  Task id: {{task_id}}
  Task:
  {{task}}
