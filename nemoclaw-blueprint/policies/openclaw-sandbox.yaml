#
# Default policy for the OpenClaw sandbox.
# Principle: deny by default, allow only what's needed for core functionality.
# Dynamic updates (network_policies, inference) can be applied post-creation
# via `openshell policy set`. Static fields are effectively creation-locked.
#
# Policy tiers (future):
#   default — this file. Minimum for onboard + basic agent operation.
#   relaxed — adds third-party model providers, broader web access.
#
# To add endpoints: update this file and re-run `nemoclaw onboard`
# or apply dynamically via `openshell policy set`.

version: 1

filesystem_policy:
  include_workdir: true
  read_only:
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /app
    - /etc
    - /var/log
    - /sandbox/.openclaw            # Immutable gateway config — prevents agent
                                    # from tampering with auth tokens or CORS.
                                    # Writable state (agents, plugins) lives in
                                    # /sandbox/.openclaw-data via symlinks.
                                    # Ref: https://github.com/NVIDIA/NemoClaw/issues/514
  read_write:
    - /sandbox
    - /tmp
    - /dev/null
    - /sandbox/.openclaw-data       # Writable agent/plugin state (symlinked from .openclaw)

landlock:
  compatibility: best_effort

process:
  run_as_user: sandbox
  run_as_group: sandbox

network_policies:
  claude_code:
    name: claude_code
    endpoints:
      - host: api.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: statsig.anthropic.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: sentry.io
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/local/bin/claude }

  nvidia:
    name: nvidia
    endpoints:
      - host: integrate.api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      - host: inference-api.nvidia.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/local/bin/openclaw }

  github:
    name: github
    endpoints:
      - host: github.com
        port: 443
        access: full
      - host: api.github.com
        port: 443
        access: full
    binaries:
      - { path: /usr/bin/gh }
      - { path: /usr/bin/git }

  # ── OpenClaw "phone home" ────────────────────────────────────────────
  # Minimum viable set for OpenClaw to authenticate, discover plugins,
  # and reach ClawHub. Restricted to openclaw and node (skill flows run on Node).
  # Docs access is read-only (GET). ClawHub and openclaw.ai are
  # restricted to GET+POST (auth flows, plugin discovery).

  clawhub:
    name: clawhub
    endpoints:
      - host: clawhub.ai
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }

  openclaw_api:
    name: openclaw_api
    endpoints:
      - host: openclaw.ai
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/node }

  openclaw_docs:
    name: openclaw_docs
    endpoints:
      - host: docs.openclaw.ai
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
    binaries:
      - { path: /usr/local/bin/openclaw }

  # npm registry — needed for `openclaw plugins install` and `npm install`
  npm_registry:
    name: npm_registry
    endpoints:
      - host: registry.npmjs.org
        port: 443
        access: full
    binaries:
      - { path: /usr/local/bin/openclaw }
      - { path: /usr/local/bin/npm }
      - { path: /usr/local/bin/node }

  # ── Messaging — pre-allowed for OpenClaw agent notifications ────
  # Restricted to node processes to prevent arbitrary data exfiltration
  # via curl, wget, python, etc. (See: #272)
  telegram:
    name: telegram
    endpoints:
      - host: api.telegram.org
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/bot*/**" }
          - allow: { method: POST, path: "/bot*/**" }
          - allow: { method: GET, path: "/file/bot*/**" }
    binaries:
      - { path: /usr/local/bin/node }

  discord:
    name: discord
    endpoints:
      - host: discord.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      # WebSocket gateway — must use access: full (CONNECT tunnel) instead
      # of protocol: rest. The proxy's HTTP idle timeout (~2 min) kills
      # long-lived WebSocket connections; a CONNECT tunnel avoids
      # HTTP-level timeouts entirely. Matches presets/discord.yaml. See #409.
      - host: gateway.discord.gg
        port: 443
        access: full
      - host: cdn.discordapp.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
    binaries:
      - { path: /usr/local/bin/node }

  # ── Go toolchain ─────────────────────────────────────────────────
  # Download and install Go runtime (curl/wget https://go.dev/dl/...)
  go_install:
    name: go_install
    endpoints:
      - host: go.dev
        port: 443
        access: full
      - host: dl.google.com
        port: 443
        access: full
      - host: golang.org
        port: 443
        access: full
    binaries:
      - { path: /usr/bin/curl }
      - { path: /usr/bin/wget }

  # ── Go module proxy ──────────────────────────────────────────────
  # Required for `go mod download`, `go build`, `go get`.
  # access: full — the Go binary opens TLS connections itself
  # (not via curl/wget), so it needs CONNECT tunnels through the proxy.
  go_modules:
    name: go_modules
    endpoints:
      - host: proxy.golang.org
        port: 443
        access: full
      - host: sum.golang.org
        port: 443
        access: full
      - host: storage.googleapis.com
        port: 443
        access: full
    binaries:
      - { path: "/usr/local/go/bin/go" }
      - { path: "/sandbox/go/bin/go" }
      - { path: "/sandbox/**/go" }

  # ── Go module Git sources ────────────────────────────────────────
  # go-proton-api deps require direct Git fetches from GitHub/GitLab.
  # ProtonMail modules: go-crypto, gopenpgp, go-srp, gluon, etc.
  # Also gitlab.com/c0b/go-ordered-json.
  go_module_git_sources:
    name: go_module_git_sources
    endpoints:
      - host: github.com
        port: 443
        access: full
      - host: "*.github.com"
        port: 443
        access: full
      - host: gitlab.com
        port: 443
        access: full
      - host: "*.gitlab.com"
        port: 443
        access: full
    binaries:
      - { path: "/usr/local/go/bin/go" }
      - { path: "/sandbox/go/bin/go" }
      - { path: "/sandbox/**/go" }
      - { path: /usr/bin/git }

  # ── Proton API (proton-calendar skill) ─────────────────────────
  # go-proton-api uses SRP auth + PGP encryption, which requires the Go
  # HTTP client to manage its own TLS sessions. Use access: full (CONNECT
  # tunnel) so the proxy passes traffic through without TLS termination.
  # AppVersion must be web-mail@5.0.36 (free accounts); linux-bridge@*
  # requires a paid Proton plan.
  proton_api:
    name: proton_api
    endpoints:
      - host: mail-api.proton.me
        port: 443
        access: full
      - host: mail.proton.me
        port: 443
        access: full
      # Legacy API domain — some go-proton-api versions still resolve here.
      - host: api.protonmail.ch
        port: 443
        access: full
      - host: account.proton.me
        port: 443
        access: full
    binaries:
      - { path: "/sandbox/**" }
