preset:
  name: whatsapp
  description: "WhatsApp Web protocol (session-based, requires pre-paired creds.json)"

network_policies:
  whatsapp:
    name: whatsapp
    endpoints:
      # Primary WebSocket connection to WhatsApp Web — persistent WSS.
      # Must use access: full (CONNECT tunnel) to survive the proxy's HTTP
      # idle timeout that would kill long-lived WebSocket connections. See #409.
      - host: web.whatsapp.com
        port: 443
        access: full
      # Sharded WebSocket nodes (e.g. e1.web.whatsapp.com, e2.web.whatsapp.com)
      - host: "*.web.whatsapp.com"
        port: 443
        access: full
      # Media management gateway — upload and download attachments.
      # Uses full access because TLS is managed by the WhatsApp client, not
      # via HTTP-layer negotiation the proxy can terminate cleanly.
      - host: mmg.whatsapp.net
        port: 443
        access: full
      # CDN media nodes (geo-distributed, e.g. 1.fna.whatsapp.net)
      - host: "*.fna.whatsapp.net"
        port: 443
        access: full
      # Version/config API (REST — proxy can terminate TLS here)
      - host: v.whatsapp.net
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
          - allow: { method: POST, path: "/**" }
      # Static assets — sticker packs, emoji metadata, etc.
      - host: static.whatsapp.net
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: GET, path: "/**" }
    binaries:
      - { path: /usr/local/bin/node }
