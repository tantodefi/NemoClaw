<style>
  .CodeMirror { height:440px; border:1px solid var(--border); border-radius:8px; margin-top:8px; font-size:12.5px; }
  :root { --bg:#0d1117; --panel:#161b22; --border:#30363d; --fg:#e6edf3; --muted:#8b949e;
          --green:#3fb950; --red:#f85149; --blue:#58a6ff; --yellow:#d29922; --accent:#58a6ff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.5 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:14px; padding:12px 20px; border-bottom:1px solid var(--border); background:var(--panel); position:sticky; top:0; z-index:5; }
  header h1 { font-size:15px; margin:0; font-weight:600; white-space:nowrap; }
  .tab { color:var(--muted); cursor:pointer; padding:4px 10px; border-radius:6px; }
  .tab.active { color:var(--fg); background:#21262d; }
  .spacer { flex:1; }
  .meta { color:var(--muted); font-size:12px; }
  .wrap { display:grid; grid-template-columns:minmax(340px,38%) 1fr; height:calc(100vh - 50px); }
  .list { overflow:auto; border-right:1px solid var(--border); }
  .detail { overflow:auto; padding:18px 22px; }
  .pane { padding:18px 22px; overflow:auto; height:calc(100vh - 50px); }
  table { width:100%; border-collapse:collapse; }
  th { text-align:left; color:var(--muted); font-weight:500; font-size:12px; padding:8px 12px; position:sticky; top:0; background:var(--bg); }
  td { padding:8px 12px; border-top:1px solid var(--border); vertical-align:top; }
  tr.run { cursor:pointer; } tr.run:hover { background:#161b22; } tr.run.sel { background:#1f2630; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:11px; font-weight:600; }
  .pill.finished,.pill.approved{ background:rgba(63,185,80,.15); color:var(--green); }
  .pill.failed,.pill.errored,.pill.denied{ background:rgba(248,81,73,.15); color:var(--red); }
  .pill.running,.pill.in-progress,.pill.pending{ background:rgba(88,166,255,.15); color:var(--blue); }
  .pill.running::before,.pill.in-progress::before{ content:"● "; animation:pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.25} }
  .pill.cancelled,.pill.unknown{ background:#21262d; color:var(--muted); }
  .stale { color:var(--yellow); font-size:12px; }
  .mono { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .muted { color:var(--muted); }
  h2 { font-size:16px; margin:0 0 4px; } h3 { font-size:13px; color:var(--muted); margin:18px 0 6px; text-transform:uppercase; letter-spacing:.04em; }
  pre { background:#0b0f14; border:1px solid var(--border); border-radius:8px; padding:10px 12px; overflow:auto; font-size:12px; }
  .err { color:var(--red); white-space:pre-wrap; }
  details { border:1px solid var(--border); border-radius:8px; margin:6px 0; padding:6px 10px; background:var(--panel); }
  summary { cursor:pointer; font-weight:600; }
  .empty { color:var(--muted); padding:40px; text-align:center; }
  .logpanel { background:#0b0f14; border:1px solid var(--border); border-radius:8px; padding:8px 10px; max-height:300px; overflow:auto; font-family:ui-monospace,monospace; font-size:11.5px; line-height:1.55; }
  .ev.t-RunStarted,.ev.t-RunFinished,.ev.t-NodeFinished { color:var(--green); }
  .ev.t-NodeFailed,.ev.t-RunFailed { color:var(--red); }
  .ev.t-NodeStarted { color:var(--blue); }
  .ev .ts { color:var(--muted); }
  button { font:inherit; cursor:pointer; border:1px solid var(--border); background:#21262d; color:var(--fg); border-radius:6px; padding:4px 12px; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#04101f; border-color:var(--accent); font-weight:600; }
  button.danger { color:var(--red); border-color:rgba(248,81,73,.4); background:transparent; }
  input.search { background:#0b0f14; border:1px solid var(--border); color:var(--fg); border-radius:6px; padding:5px 10px; width:100%; }
  textarea.editor { width:100%; min-height:420px; background:#0b0f14; color:var(--fg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12.5px; line-height:1.55; resize:vertical; tab-size:2; margin-top:8px; }
  .row { display:flex; gap:10px; align-items:center; }
  .card { border:1px solid var(--border); border-radius:8px; padding:12px 14px; margin:8px 0; background:var(--panel); }
  .md h1,.md h2,.md h3 { text-transform:none; letter-spacing:0; color:var(--fg); }
  .md table { margin:6px 0; } .md th,.md td { border:1px solid var(--border); padding:4px 8px; font-size:12px; }
  .md code { background:#0b0f14; padding:1px 5px; border-radius:4px; font-family:ui-monospace,monospace; }
  a { color:var(--accent); }
  .modal-bg{ position:fixed; inset:0; background:rgba(1,4,9,.6); display:flex; align-items:flex-start; justify-content:center; z-index:50; padding:38px 16px; overflow:auto; }
  .modal{ background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:16px 18px; width:min(680px,96vw); box-shadow:0 16px 48px rgba(0,0,0,.55); }
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:8px 14px; margin-top:8px; }
  .fld{ display:flex; flex-direction:column; gap:3px; font-size:12px; color:var(--muted); }
  .fld input,.fld select,.fld textarea{ background:#0b0f14; border:1px solid var(--border); color:var(--fg); border-radius:6px; padding:5px 8px; font:inherit; font-size:13px; }
  @media(max-width:560px){ .grid2{ grid-template-columns:1fr; } }
</style>

<div id="view-runs" class="wrap">
  <div class="list">
    <div style="padding:8px 12px;border-bottom:1px solid var(--border)"><input class="search" id="search" placeholder="filter runs (workflow / status / id)…"></div>

<script>
const fmtTime = (ms) => ms ? new Date(ms).toLocaleString() : "—";
const fmtDur = (a,b) => { if(a&&b){ const ms=b-a; return ms<1000 ? ms+"ms" : (ms/1000).toFixed(1)+"s"; } return a&&!b ? "running" : "—"; };
const TERMINAL = new Set(["finished","failed","cancelled","errored"]);
const isLive = (r) => !TERMINAL.has(String(r.status||"").toLowerCase());
const pill = (s) => `<span class="pill ${String(s||'unknown').toLowerCase()}">${esc(s||'unknown')}</span>`;
const esc = (s) => String(s??"").replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let selected=null, detailTimer=null, allRuns=[], filter="";
const editors={};
if(window.mermaid){ try{ mermaid.initialize({startOnLoad:false,theme:"dark",securityLevel:"loose",flowchart:{useMaxWidth:true}}); }catch{} }

function keyHdr(){ const k=new URLSearchParams(location.search).get("key"); return k?{"x-smithers-key":k}:{}; }
async function api(p){ const r=await fetch(p,{headers:keyHdr()}); if(!r.ok) throw new Error(p+" "+r.status); return r.json(); }
async function post(p,body){ const r=await fetch(p,{method:"POST",headers:{"content-type":"application/json",...keyHdr()},body:JSON.stringify(body||{})}); const j=await r.json().catch(()=>({})); if(!r.ok) throw new Error(j.error||("HTTP "+r.status)); return j; }

// minimal markdown (headings, bold, code, pipe-tables) for report rendering
function md(src){
  const lines=String(src||"").split("\n"); let html="", i=0;
  while(i<lines.length){
    let l=lines[i];
    if(/^\|.*\|/.test(l)){ const tbl=[]; while(i<lines.length&&/^\|.*\|/.test(lines[i])){ tbl.push(lines[i]); i++; }
      const rows=tbl.filter(r=>!/^\|[\s|:-]+\|$/.test(r)).map(r=>r.split("|").slice(1,-1).map(c=>c.trim()));
      html+="<table>"+rows.map((r,ri)=>"<tr>"+r.map(c=>`<${ri?'td':'th'}>${inl(c)}</${ri?'td':'th'}>`).join("")+"</tr>").join("")+"</table>"; continue; }
    if(/^### /.test(l)) html+=`<h3>${inl(l.slice(4))}</h3>`;
    else if(/^## /.test(l)) html+=`<h2>${inl(l.slice(3))}</h2>`;
    else if(/^# /.test(l)) html+=`<h1>${inl(l.slice(2))}</h1>`;
    else if(l.trim()==="") html+="";
    else html+=`<div>${inl(l)}</div>`;
    i++;
  }
  return html;
  function inl(s){ return esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/`(.+?)`/g,"<code>$1</code>"); }
}

async function loadRuns(){
  try {
    const {runs}=await api("/api/runs"); allRuns=runs;
    let h={dbs:[]}; try{h=await api("/api/health");}catch{}
    const live=runs.filter(isLive).length;
    document.getElementById("meta").textContent=`${runs.length} runs · ${h.dbs.length} db${live?` · ${live} live`:""}`;
    renderRuns();
    loadApprovalsBadge();
  } catch(e){ document.getElementById("meta").textContent="API error: "+e.message; }
}
function renderRuns(){
  const f=filter.toLowerCase();
  const rows=allRuns.filter(r=>!f || `${r.workflow_name} ${r.status} ${r.run_id} ${r.db}`.toLowerCase().includes(f));
  const tb=document.getElementById("runs");
  tb.innerHTML=rows.map(r=>`<tr class="run ${r.run_id===selected?'sel':''}" data-id="${esc(r.run_id)}">
    <td><div>${esc(r.workflow_name||'?')}${r.chainId?` <a href="#" onclick="event.stopPropagation();gotoChain('${esc(r.chainId)}');return false" class="pill" style="background:rgba(88,166,255,.15);color:var(--blue);font-size:10px" title="part of chain ${esc(r.chainId)}">🔗 ${r.chainStep}/${r.chainSteps}</a>`:''}</div><div class="muted mono" style="font-size:11px">${esc((r.run_id||'').slice(0,8))} · ${esc(r.db)}</div></td>
    <td>${pill(r.status)}</td><td class="muted">${fmtTime(r.started_at_ms||r.created_at_ms)}</td>
    <td class="muted">${isLive(r)?'…':fmtDur(r.started_at_ms,r.finished_at_ms)}</td></tr>`).join("")
    || `<tr><td colspan=4 class=empty>${f?'no matches':'No runs yet.'}</td></tr>`;
  tb.querySelectorAll("tr.run").forEach(tr=>tr.onclick=()=>selectRun(tr.dataset.id));
}
document.getElementById("search").oninput=(e)=>{ filter=e.target.value; renderRuns(); };

function selectRun(id){ selected=id; if(detailTimer){clearInterval(detailTimer);detailTimer=null;} loadDetail(id); }
async function loadDetail(id){
  if(selected!==id) return;
  document.querySelectorAll("tr.run").forEach(tr=>tr.classList.toggle("sel",tr.dataset.id===id));
  const d=document.getElementById("detail");
  try {
    const [det,logs]=await Promise.all([api("/api/runs/"+encodeURIComponent(id)),api("/api/runs/"+encodeURIComponent(id)+"/logs").catch(()=>({events:[]}))]);
    if(selected!==id) return;
    const {run,attempts,outputs,telemetry={tokens:{byNode:{}},traces:{}}}=det, live=isLive(run);
    const tok=telemetry.tokens?.byNode||{}, trc=telemetry.traces||{};
    // Per-node token + capture badge. "reasoning hidden" explains why a final
    // answer can be short: the model generated many more tokens than are stored.
    const nodeTokens=(n)=>{ const t=tok[n], c=trc[n]; if(!t&&!c) return '';
      const out=t?(t.outputTokens||0)+(t.reasoningTokens||0):0, inp=t?t.inputTokens||0:0;
      const hid=c&&c.reasoningHidden?` <span class="pill" title="final-only capture — the model generated ~${out} output tokens incl. reasoning, but only the final answer is stored, so a short row is expected (not a placeholder)" style="background:rgba(210,153,34,.18);color:var(--yellow)">🧠 reasoning hidden</span>`:'';
      return `${t?`<span class="muted mono" style="font-size:11px" title="input ↓ / output ↑ tokens">${inp}↓ ${out}↑</span>`:''}${hid}`; };
    const stale=live&&run.heartbeat_at_ms&&(Date.now()-run.heartbeat_at_ms>60000);
    const cancelBtn=live?`<button class="danger" onclick="cancelRun('${esc(id)}')">Cancel</button>`:"";
    const resumeBtn=String(run.status).toLowerCase()!=="finished"?`<button onclick="resumeRun('${esc(id)}')" title="Resume from the last durable checkpoint">Resume ⟳</button>`:"";
    const wfFile=run.workflow_path?(run.workflow_path.includes('/workflows/')?'workflows/'+run.workflow_path.split('/').pop():run.workflow_path.split('/').pop()):null;
    const rerunBtn=wfFile?`<button onclick="openLaunch('${esc(wfFile)}')" title="Launch this workflow again with adjustable settings">Re-run ⟳</button>`:"";
    const graphBtn=wfFile?`<button onclick="renderRunDag('${esc(id)}','${esc(wfFile)}')" title="Task graph (status-colored)">Graph ⊞</button>`:"";
    const actions=`<button onclick="loadChat('${esc(id)}')">Chat</button>${graphBtn}${rerunBtn}<button onclick="forkRun('${esc(id)}')">Fork ⑂</button>${resumeBtn}${cancelBtn}`;
    const att=attempts.map(a=>`<tr><td class="mono">${esc(a.node_id)} <a href="#" onclick="trace('${esc(id)}','${esc(a.node_id)}');return false" class="muted" style="font-size:11px">trace</a> <a href="#" onclick="diffNode('${esc(id)}','${esc(a.node_id)}');return false" class="muted" style="font-size:11px">diff</a></td>
      <td>${pill(a.state)}</td><td class="muted">${String(a.state).toLowerCase()==='in-progress'?'running':fmtDur(a.started_at_ms,a.finished_at_ms)}</td>
      <td>${nodeTokens(a.node_id)}</td>
      <td class="err">${a.error_json?esc((()=>{try{return JSON.parse(a.error_json).message}catch{return a.error_json}})()).slice(0,160):""}</td></tr>`).join("");
    // Render each output table; if a row has a substantial text field (fused
    // answer, report summary, etc.) show it readably and tuck the structured
    // fields behind a sub-disclosure — so compute-node outputs (select/report/
    // fusion) are legible instead of a raw JSON blob or a blank row.
    const TEXTKEYS=["fused","summary","text","note","body","content","detail","rationale"];
    const outs=Object.entries(outputs).map(([t,rows])=>{
      const open=["report","fusion","synthesize","judgment"].includes(t);
      const body=rows.map(r=>{
        const big=TEXTKEYS.map(k=>r[k]).find(v=>typeof v==="string"&&v.length>40);
        const meta=Object.fromEntries(Object.entries(r).filter(([k])=>!["run_id","node_id","iteration"].includes(k)));
        return big
          ? `<div class="md">${md(big)}</div><details><summary class="muted" style="font-weight:400">fields</summary><pre>${esc(JSON.stringify(meta,null,2))}</pre></details>`
          : `<pre>${esc(JSON.stringify(meta,null,2))}</pre>`;
      }).join("");
      return `<details ${open?'open':''}><summary>${esc(t)} (${rows.length})</summary>${body}</details>`;
    }).join("");
    const logHtml=(logs.events||[]).map(ev=>{const ts=ev.timestampMs?new Date(ev.timestampMs).toLocaleTimeString():"";return `<div class="ev t-${esc(ev.type||'')}"><span class="ts">${ts}</span> ${esc(ev.type||ev.raw||'')}${ev.nodeId?' · '+esc(ev.nodeId):''}${ev.message?' · '+esc(ev.message):''}</div>`;}).join("");
    d.innerHTML=`<div class="row"><h2 style="flex:1">${esc(run.workflow_name||'run')} ${pill(run.status)}${stale?' <span class="stale">⚠ stale</span>':''}</h2>${actions}</div>
      <div class="muted mono">${esc(run.run_id)} · ${esc(run.db)}${(()=>{const cr=allRuns.find(r=>r.run_id===id);return cr&&cr.chainId?` · <a href="#" onclick="gotoChain('${esc(cr.chainId)}');return false" title="part of a workflow chain">🔗 chain ${esc(cr.chainId)} · step ${cr.chainStep}/${cr.chainSteps}</a>`:'';})()}</div>
      <div class="muted">started ${fmtTime(run.started_at_ms)} · ${live?'<b style="color:var(--blue)">running…</b>':'finished '+fmtTime(run.finished_at_ms)} · ${fmtDur(run.started_at_ms,run.finished_at_ms)}</div>
      ${(()=>{const ff=new Set((attempts||[]).filter(a=>String(a.state).toLowerCase()==='failed').map(a=>a.node_id));return (String(run.status).toLowerCase()==='finished'&&ff.size)?`<div style="color:var(--yellow);font-size:12px;margin-top:2px">✓ finished with ${ff.size} tolerated task failure${ff.size>1?'s':''} (continueOnFail / fallback) — e.g. a slow or unsupported panel model; the run completed with the rest.</div>`:'';})()}
      ${telemetry.tokens&&telemetry.tokens.totalTokens?`<div class="muted">tokens · ${telemetry.tokens.inputTokens}↓ in · ${telemetry.tokens.outputTokens}↑ out${telemetry.tokens.reasoningTokens?` · ${telemetry.tokens.reasoningTokens} reasoning`:''} · ${telemetry.tokens.totalTokens} total</div>`:''}
      ${run.error_json?`<h3>error</h3><pre class="err">${esc(run.error_json)}</pre>`:""}
      <div id="chatbox"></div>
      <h3>tasks (${attempts.length})</h3><table><thead><tr><th>node</th><th>state</th><th>dur</th><th>tokens</th><th>error</th></tr></thead><tbody>${att||'<tr><td colspan=5 class=muted>waiting…</td></tr>'}</tbody></table>
      <div id="tracebox"></div>
      <h3>event log${live?' · live':''} ${logs.total?`<span class="muted">(${logs.total})</span>`:''}</h3><div class="logpanel" id="logpanel">${logHtml||'<span class=muted>no events</span>'}</div>
      <h3>outputs</h3>${outs||'<div class="muted">no output rows</div>'}`;
    const lp=document.getElementById("logpanel"); if(lp) lp.scrollTop=lp.scrollHeight;
    if(live&&selected===id&&!detailTimer) detailTimer=setInterval(()=>{ if(selected===id) loadDetail(id); else {clearInterval(detailTimer);detailTimer=null;} },2500);
    else if(!live&&detailTimer){ clearInterval(detailTimer); detailTimer=null; }
  } catch(e){ d.innerHTML=`<div class="empty">error: ${esc(e.message)}</div>`; }
}
async function cancelRun(id){ if(!confirm("Cancel this run?"))return; try{ await post("/api/runs/"+encodeURIComponent(id)+"/cancel"); setTimeout(()=>{loadDetail(id);loadRuns();},1000); }catch(e){ alert("cancel failed: "+e.message); } }
async function resumeRun(id){ if(!confirm("Resume this run from its last checkpoint?"))return; try{ await post("/api/runs/"+encodeURIComponent(id)+"/resume"); setTimeout(()=>{loadDetail(id);loadRuns();},1500); }catch(e){ alert("resume failed: "+e.message+(String(e.message).includes("forbidden")?" (needs Access login or ?key=)":"")); } }
// Status-colored task DAG for a run: overlay the run's attempt states onto the
// workflow's static graph (rendered into the tracebox, mermaid w/ pre fallback).
async function renderRunDag(id,wf){ const box=document.getElementById("tracebox"); if(!box)return; box.innerHTML="<h3>task graph · "+esc(wf)+"</h3><div class=muted>rendering…</div>";
  try{ const [g,det]=await Promise.all([api("/api/workflow-graph?name="+encodeURIComponent(wf)),api("/api/runs/"+encodeURIComponent(id))]);
    const dag=g.dag; if(!dag||!dag.nodes.length){ box.innerHTML="<h3>task graph</h3><div class=muted>no graph for this workflow</div>"; return; }
    const st={}; (det.attempts||[]).forEach(a=>{ st[a.node_id]=String(a.state||"").toLowerCase(); });
    const nid=x=>"n_"+String(x).replace(/[^a-zA-Z0-9]/g,"_");
    const byNid={}; dag.nodes.forEach(n=>byNid[nid(n.id)]=n);
    let m="flowchart TD\n";
    dag.nodes.forEach(n=>{ m+=`  ${nid(n.id)}["${mlabel(n)}"]\n`; const s=st[n.id]; const cls=s==="finished"?"ok":(s==="failed"||s==="errored")?"bad":(s==="in-progress"||s==="running")?"run":""; if(cls) m+=`  class ${nid(n.id)} ${cls}\n`; });
    dag.edges.forEach(e=>{ m+=`  ${nid(e.from)} --> ${nid(e.to)}\n`; });
    m+="classDef ok fill:#10331c,stroke:#3fb950,color:#e6edf3\nclassDef bad fill:#3a1518,stroke:#f85149,color:#e6edf3\nclassDef run fill:#0d2847,stroke:#58a6ff,color:#e6edf3\n";
    if(window.mermaid){ try{ const {svg}=await mermaid.render("rd"+id.replace(/[^a-z0-9]/gi,"")+Date.now(),m);

// Make rendered mermaid nodes clickable → the node settings inspector. Robust

function nodeTipHtml(node,ctx){

// The "settings passed into each node" panel + tweak actions. Declared control

      :`<div class="muted" style="margin-top:8px">no runtime telemetry for this node (compute node, or run produced no token events)</div>`;
  }

    <div class="row"><b class="mono" style="flex:1">${esc(node.id)}</b><span class="pill" style="background:#21262d;color:var(--muted)">${esc(node.type||"task")}${node.group?` · in ${esc(node.group)}`:""}</span></div>

function renderChainSteps(){

function chainCardHtml(ch){

  const flow=ch.steps.map((s,i)=>{
    const cur=i===ch.current&&ch.status==="running";
    const st=String(s.status||'pending').toLowerCase();
    const rid=s.runId;
    const open=rid?`<a href="#" onclick="switchTab('runs');selectRun('${esc(rid)}');return false" title="open run detail">${esc(rid.slice(0,8))} ↗</a>`:'<span class="muted">—</span>';

      ${rid&&st!=='finished'?`<button style="${sbtn}" onclick="resumeRun('${esc(rid)}')" title="Resume this step's run from its checkpoint">Resume ⟳</button>`:''}
      ${rid?`<button style="${sbtn}" onclick="forkRun('${esc(rid)}')" title="Fork this step's run (time-travel)">Fork ⑂</button>`:''}

  const ctrls=`${failed?`<button class="primary" onclick="resumeChain('${esc(ch.id)}')" title="Re-run the step it stopped on and continue">Resume chain ▶</button>`:''}
    <button onclick="forkChain('${esc(ch.id)}')" title="Copy this chain into a fresh run from step 1 (leaves this one untouched)">Fork ⑂</button>

}

  if(!sig) return '<div class="muted">no signal available</div>';
  const fc=sig.errorClusters||[],ls=sig.lowScorers||[],sr=sig.staleRuns||[],fr=sig.failedRuns||[];
  return `<div class="muted" style="font-size:11px">scanned ${sig.scannedDbs} DBs · ${fr.length} failed · ${sr.length} stale · ${ls.length} low scorers — this digest is fed into the arena's reflective mutation each run</div>
    ${fc.length?`<h3 style="margin-top:10px">failure clusters</h3>${fc.map(e=>`<div style="font-size:12px;margin:2px 0"><span class="pill failed">${e.count}×</span> <span class="mono">${esc(e.error)}</span></div>`).join("")}`:''}
    ${ls.length?`<h3 style="margin-top:10px">lowest-scoring candidates</h3>${ls.slice(0,8).map(l=>`<div style="font-size:12px;margin:2px 0"><b class="mono">${esc(l.task)}</b> on ${esc(l.model)} = <b style="color:var(--red)">${l.score}</b> <span class="muted">${esc(l.why||'')}</span></div>`).join("")}`:''}
    ${sr.length?`<h3 style="margin-top:10px">stale non-terminal runs</h3>${sr.slice(0,8).map(r=>`<div style="font-size:12px;margin:2px 0"><a href="#" onclick="switchTab('runs');selectRun('${esc(r.runId)}');return false">${esc((r.runId||'').slice(0,8))}</a> ${esc(r.workflow||'')} · ${pill(r.status)} <span class="muted">(${esc(r.db)})</span></div>`).join("")}`:''}
    ${fr.length?`<details style="margin-top:10px"><summary class="muted">recent failed runs (${fr.length})</summary>${fr.map(r=>`<div style="font-size:11px;margin:2px 0"><a href="#" onclick="switchTab('runs');selectRun('${esc(r.runId)}');return false">${esc((r.runId||'').slice(0,8))}</a> ${esc(r.workflow||'')}: <span class="err">${esc(r.error||'')}</span></div>`).join("")}</details>`:''}
    ${!fc.length&&!ls.length&&!sr.length&&!fr.length?'<div class="muted">clean — nothing flagged in the window</div>':''}`;
}
async function saveDirectives(){
  const v=(id)=>{const e=document.getElementById(id);return e?e.value:"";};
  const d={...(_directives||{})};
  d.experiments=v('dir-exp'); d.creativity=v('dir-crea').trim();
  d.priorities=v('dir-prio').split(',').map(s=>s.trim()).filter(Boolean);
  d.systemPrompts={...(d.systemPrompts||{}),all:v('dir-sp-all'),draft:v('dir-sp-draft'),judge:v('dir-sp-judge')};
  const st=document.getElementById("dir-status"); st.style.color="var(--muted)"; st.textContent="saving…";
  try{ await post("/api/directives",d); st.style.color="var(--green)"; st.textContent="✓ saved — applies on the next run"; _directives=d; }
  catch(e){ st.style.color="var(--red)"; st.textContent="failed: "+e.message+(String(e.message).includes("forbidden")?" (needs Access login or ?key=)":""); }
}

const spark=(scores)=>{ const b="▁▂▃▄▅▆▇█"; return (scores||[]).map(s=>b[Math.min(7,Math.max(0,Math.round((Number(s)||0)*7)))]).join("")||"—"; };
// rough inference-cost rank (cheaper = lower) for downgrade recommendations
function costRank(m){ m=String(m); if(/nano/.test(m))return 1; if(/super|flash|gemma|gpt-oss|mini\b/.test(m))return 2; if(/claude-opus/.test(m))return 5; if(/claude/.test(m))return 4; if(/ultra|deepseek-v4-pro|397|maverick|kimi|glm-5|minimax|405|step-3/.test(m))return 3; return 2; }
// dependency-free inline SVG charts (CDN libs gracefully absent behind Access)
function svgBars(rows,{w=340,bh=16,gap=7,max=100}={}){ const lw=120,h=rows.length*(bh+gap)+4;
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="max-width:${w}px">`+rows.map((r,i)=>{const y=i*(bh+gap)+2;const bw=Math.max(0,Math.min(1,(Number(r.value)||0)/max))*(w-lw-34);
    return `<text x="0" y="${y+bh-3}" fill="var(--muted)" font-size="11">${esc(String(r.label)).slice(0,18)}</text><rect x="${lw}" y="${y}" width="${bw.toFixed(1)}" height="${bh}" rx="3" fill="${r.color||'var(--blue)'}"/><text x="${(lw+bw+4).toFixed(1)}" y="${y+bh-3}" fill="var(--fg)" font-size="11">${r.value==null?'·':r.value}</text>`;}).join("")+`</svg>`; }
function svgLines(series,{w=340,h=130,max=1}={}){ const pad=18,n=Math.max(2,...series.map(s=>s.points.length));
  const X=i=>pad+(i*(w-pad*2)/(n-1)),Y=v=>h-pad-(Math.max(0,Math.min(1,(Number(v)||0)/max)))*(h-pad*2);
  const axes=`<line x1="${pad}" y1="${h-pad}" x2="${w-pad}" y2="${h-pad}" stroke="var(--border)"/><line x1="${pad}" y1="${pad}" x2="${pad}" y2="${h-pad}" stroke="var(--border)"/>`;
  const lines=series.map(s=>`<polyline fill="none" stroke="${s.color}" stroke-width="1.5" points="${s.points.map((v,i)=>`${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(" ")}"/>`).join("");
  const legend=series.map((s,i)=>`<text x="${(pad+i*84).toFixed(0)}" y="11" fill="${s.color}" font-size="10">${esc(String(s.label)).slice(0,11)}</text>`).join("");
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" style="max-width:${w}px">${axes}${lines}${legend}</svg>`; }
async function loadExperiments(){
  const el=document.getElementById("experiments");
  try{
    const [exp,rr,mm,eff]=await Promise.all([api("/api/experiments"),api("/api/runs").catch(()=>({runs:[]})),api("/api/model-matrix").catch(()=>null),api("/api/efficiency").catch(()=>null)]);
    const {population,report}=exp;
    const nights=(rr.runs||[]).filter(r=>r.workflow_name==="chad-experiments");
    const cands=(population.candidates||[]).slice().sort((a,b)=>(b.rollingMean||0)-(a.rollingMean||0));
    const by={champion:0,active:0,retired:0}; cands.forEach(c=>{ by[c.status]=(by[c.status]||0)+1; });
    const short=(m)=>String(m).split("/").pop();
    const cellBg=(v)=>v==null?"transparent":`hsl(${Math.round((Number(v)||0)*1.2)} 55% 20%)`;
    const matrixHtml = mm && mm.tasks && mm.tasks.length ? `
      <h3>model × task — best model per task ⭐</h3>
      <div style="overflow:auto"><table><thead><tr><th>task ↓ / model →</th>${mm.models.map(m=>`<th title="${esc(m)}">${esc(short(m))}</th>`).join("")}</tr></thead><tbody>
        ${mm.tasks.map(t=>`<tr><td class="mono" style="font-size:12px">${esc(t)}</td>${mm.models.map(m=>{const c=mm.matrix[t][m];const isb=mm.best[t]===m;return `<td style="text-align:center;background:${cellBg(c&&c.mean)}${isb?';outline:1px solid var(--green)':''}">${c?`${c.mean}${isb?' ⭐':''}<div class="muted" style="font-size:9px">n=${c.n}</div>`:'<span class=muted>·</span>'}</td>`;}).join("")}</tr>`).join("")}
        <tr><td class="muted">avg</td>${mm.models.map(m=>`<td style="text-align:center" class="muted">${mm.modelAvg[m]==null?'·':mm.modelAvg[m]}</td>`).join("")}</tr>
      </tbody></table></div>
      <div class="muted" style="font-size:11px">From token-optimize benchmark runs — each task's fixture scored 0-100 by the judge. Runs nightly; widen state/downgrade-candidates.json for more coverage.</div>`
      : `<h3>model × task</h3><div class="muted">No benchmark data yet — run <span class="mono">token-optimize.jsx</span> (or wait for the nightly) to populate the matrix.</div>`;
    // downgrade opportunities: cheapest model within tolerance of the best, per task
    const TOL=6, recs=[];
    if(mm&&mm.tasks) for(const t of mm.tasks){
      const scored=mm.models.map(m=>({m,c:mm.matrix[t][m]})).filter(x=>x.c).map(x=>({m:x.m,score:x.c.mean}));
      if(!scored.length)continue;
      const best=scored.reduce((a,b)=>b.score>a.score?b:a);
      const cheapest=scored.filter(x=>x.score>=best.score-TOL).sort((a,b)=>costRank(a.m)-costRank(b.m))[0];
      if(cheapest&&costRank(cheapest.m)<costRank(best.m)) recs.push({task:t,use:cheapest.m,useScore:cheapest.score,vs:best.m,vsScore:best.score});
    }
    const modelBars=mm&&mm.models?mm.models.map(m=>({label:short(m),value:mm.modelAvg[m],color:"var(--green)"})).filter(r=>r.value!=null):[];
    const colors=["#58a6ff","#3fb950","#d29922","#f85149"];
    const champSeries=cands.filter(c=>c.status==="champion"&&(c.scores||[]).length).slice(0,4).map((c,i)=>({label:c.spec?.label||c.id,points:(c.scores||[]).map(Number),color:colors[i%4]}));
    const outc={}; (rr.runs||[]).forEach(r=>{const s=String(r.status||"unknown").toLowerCase();outc[s]=(outc[s]||0)+1;});
    const chartsHtml=`
      <div class="row" style="gap:24px;flex-wrap:wrap;align-items:flex-start">
        <div style="flex:1;min-width:280px"><h3>model average — all tasks</h3>${modelBars.length?svgBars(modelBars):'<div class=muted>no data</div>'}</div>
        <div style="flex:1;min-width:280px"><h3>champion score trend</h3>${champSeries.length?svgLines(champSeries):'<div class=muted>no champions yet</div>'}</div>
      </div>
      <h3>downgrade opportunities ${recs.length?`<span class="pill" style="background:rgba(63,185,80,.15);color:var(--green)">${recs.length}</span>`:''}</h3>
      ${recs.length?recs.map(r=>`<div class="card" style="padding:8px 12px"><b class="mono">${esc(r.task)}</b> → use <b>${esc(short(r.use))}</b> <span class="muted">(${r.useScore})</span> instead of ${esc(short(r.vs))} <span class="muted">(${r.vsScore})</span> — within ${TOL}pts at a cheaper tier. <a href="#" onclick="openLaunch('workflows/token-optimize.jsx');return false">propose ↗</a></div>`).join(""):'<div class="muted">none — each task is already on its cheapest within-tolerance model (or no benchmark data yet).</div>'}
      <h3>run outcomes — all workflows</h3>
      <div class="row" style="gap:10px;flex-wrap:wrap">${Object.entries(outc).sort((a,b)=>b[1]-a[1]).map(([s,n])=>`${pill(s)}&nbsp;<b>${n}</b>`).join("")||'<span class=muted>no runs</span>'}</div>`;
    // efficiency: tokens by workflow + downgrade savings + already-cheap profiles
    const fmtTok=(n)=>n>=1e6?(n/1e6).toFixed(2)+"M":n>=1000?(n/1000).toFixed(1)+"k":String(n||0);
    const usd=(n)=>{n=Number(n)||0;return n>=1000?'$'+(n/1000).toFixed(1)+'k':'$'+n.toFixed(2);};
    const C=eff&&eff.cost?eff.cost:null;
    const costBar=(label,val,max,color)=>{const w=Math.max(1.5,Math.min(100,(max>0?val/max:0)*100));return `<div style="margin:4px 0"><div class="row" style="justify-content:space-between;font-size:11px"><span class="muted">${esc(label)}</span><span style="color:${color}">${usd(val)}</span></div><div style="height:7px;background:#0b0f14;border-radius:4px;overflow:hidden"><div style="height:100%;width:${w}%;background:${color}"></div></div></div>`;};
    // HERO — money & tokens saved vs running everything on a frontier model.
    const heroHtml=C?`<div class="card" style="background:linear-gradient(135deg,#0c2a1b 0%,#0d1b2e 100%);border-color:#1f6f43">
      <div class="row" style="align-items:center;flex-wrap:wrap;gap:24px">
        <div style="flex:1;min-width:230px">
          <div class="muted" style="font-size:11px;text-transform:uppercase;letter-spacing:.06em">saved vs frontier models</div>
          <div style="font-size:44px;font-weight:800;color:var(--green);line-height:1.05">${usd(C.saved)}</div>
          <div class="muted" style="font-size:12.5px;margin-top:2px"><b style="color:var(--fg)">${fmtTok(eff.totalTokens)}</b> tokens — would cost <b style="color:var(--red)">${usd(C.frontierCost)}</b> on ${esc(C.frontierLabel)}, run <b style="color:var(--green)">free</b> on Nemotron</div>
        </div>
        <div style="flex:1;min-width:230px">
          ${costBar("if every token → "+C.frontierLabel,C.frontierCost,C.frontierCost,'var(--red)')}
          ${costBar("at market rates (models used)",C.listCost,C.frontierCost,'var(--yellow)')}
          ${costBar("actually paid (Nemotron free)",C.actualCost,C.frontierCost,'var(--green)')}
          <div class="muted" style="font-size:10.5px;margin-top:5px">${fmtTok(eff.inputTokens)} in · ${fmtTok(eff.outputTokens)} out · rough estimates, tunable in state/model-costs.json</div>
        </div>
      </div></div>`:"";
    const mcRows=C&&C.byModel?Object.entries(C.byModel).filter(([m,b])=>b.tokens>0&&m!=='unknown').sort((a,b)=>b[1].frontierCost-a[1].frontierCost).slice(0,8):[];
    const modelCostHtml=mcRows.length?`<h3>cost by model — what each burned</h3>
      <div style="overflow:auto"><table><thead><tr><th>model</th><th>tokens</th><th>on frontier</th><th>at market</th></tr></thead><tbody>
      ${mcRows.map(([m,b])=>`<tr><td class="mono" style="font-size:12px">${esc(short(m))}</td><td class="muted">${fmtTok(b.tokens)}</td><td style="color:var(--red)">${usd(b.frontierCost)}</td><td class="muted">${usd(b.estCost)}</td></tr>`).join("")}
      </tbody></table></div>`:"";
    const effBars=eff&&eff.byWorkflow?Object.entries(eff.byWorkflow).filter(([,v])=>v&&v.tokens>0).sort((a,b)=>b[1].tokens-a[1].tokens).slice(0,8).map(([w,v])=>({label:String(w).replace(/^chad-/,""),value:v.tokens,color:"var(--blue)"})):[];
    const maxTok=effBars.length?Math.max(...effBars.map(b=>b.value)):1;
    const effHtml=eff?`
      <div class="row" style="gap:24px;flex-wrap:wrap;align-items:flex-start">
        <div style="flex:1;min-width:280px"><h3>tokens by workflow</h3>${effBars.length?svgBars(effBars,{max:maxTok}):'<div class=muted>no token data yet</div>'}</div>
        <div style="flex:1;min-width:280px"><h3>downgrade savings</h3>
          ${eff.downgrades&&eff.downgrades.length?eff.downgrades.map(d=>`<div style="font-size:12px;margin:2px 0">${esc(d.task)}: <b>${esc(short(d.from))}→${esc(short(d.to))}</b> <span style="color:var(--green)">~${d.savingsPct}% cheaper${d.savedPer1M?` · ~$${d.savedPer1M}/1M tok`:''}</span></div>`).join(""):'<div class=muted>none — tasks already on the cheapest within tolerance</div>'}
          <div class="muted" style="font-size:11px;margin-top:6px">✓ ${(eff.applied||[]).length} task-profile(s) already on a cheap (super/nano) tier</div>
        </div>
      </div>`:"";
    el.innerHTML=`<div class="row"><h2 style="flex:1">Experiments — evolutionary arena</h2>
        <span class="meta">🏆 ${by.champion} champions · ${by.active} active · 🪦 ${by.retired} retired</span></div>
      ${heroHtml}
      ${effHtml}
      ${modelCostHtml}
      ${matrixHtml}
      ${chartsHtml}
      <h3>nightly runs (${nights.length})</h3>
      ${nights.length?`<table><thead><tr><th>night</th><th>status</th><th>dur</th><th>run</th></tr></thead><tbody>${
        nights.map(r=>`<tr class="run" style="cursor:pointer" onclick="switchTab('runs');selectRun('${esc(r.run_id)}')">
          <td>${fmtTime(r.started_at_ms||r.created_at_ms)}</td><td>${pill(r.status)}</td>
          <td class="muted">${isLive(r)?'…':fmtDur(r.started_at_ms,r.finished_at_ms)}</td>
          <td class="muted mono" style="font-size:11px">${esc((r.run_id||'').slice(0,8))} ↗</td></tr>`).join("")
      }</tbody></table>`:'<div class="muted">no nightly runs recorded yet.</div>'}
      <h3>leaderboard — score trend</h3>
      <table><thead><tr><th></th><th>candidate</th><th>kind</th><th>trend</th><th>rolling</th><th>trials</th><th>status</th></tr></thead><tbody>${
        cands.map(c=>`<tr><td>${c.status==='champion'?'🏆':c.status==='retired'?'🪦':''}</td>
          <td class="mono" style="font-size:12px" title="${esc(c.id)}">${esc(c.spec?.label||c.id)}</td><td>${esc(c.kind)}</td>
          <td class="mono" style="color:var(--blue);letter-spacing:1px" title="scores: ${esc((c.scores||[]).map(s=>(+s).toFixed(2)).join(' '))}">${spark(c.scores)}</td>
          <td>${(c.rollingMean||0).toFixed(3)}</td><td>${c.trials||0}</td><td>${esc(c.status)}</td></tr>`).join("")||'<tr><td colspan=7 class=muted>none</td></tr>'
      }</tbody></table>
      <details style="margin-top:12px"><summary class="muted">latest report</summary><div class="md">${md(report)||'<span class=muted>(none)</span>'}</div></details>`;
  }catch(e){ el.innerHTML="<div class=err>"+esc(e.message)+"</div>"; }
}

function switchTab(tab){
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.tab===tab));
  for(const v of ["runs","workflows","approvals","chains","schedules","experiments","directives"]) document.getElementById("view-"+v).style.display = v===tab ? (v==="runs"?"grid":"block") : "none";
  if(tab==="workflows") loadWorkflows();
  if(tab==="approvals") loadApprovals();
  if(tab==="chains") loadChains();
  if(tab==="schedules") loadSchedules();
  if(tab==="experiments") loadExperiments();
  if(tab==="directives") loadDirectives();
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>switchTab(t.dataset.tab));

loadRuns();
updateBell();
enableNotifications(); // ask once for desktop approval notifications
document.addEventListener("click", enableNotifications, { once: true }); // fallback: some browsers need a gesture
setInterval(()=>{ if(document.getElementById("view-runs").style.display!=="none") loadRuns(); }, 5000);
setInterval(()=>{ if(document.getElementById("view-chains").style.display!=="none") refreshChainList(); }, 5000);
setInterval(loadApprovalsBadge, 15000);
</script>
