#
# agent-job — GHA-substrate runner for chad-spawn.
#
# Triggered by chad-spawn (in Chad's sandbox) via `gh workflow run`.
# Checks out the chad-spawn/<task_id> branch, installs the right CLI
# binary based on the kind manifest, runs the sub-agent against the
# rendered prompt, captures result, and pushes back to the same branch.
#
# Lives in tantodefi/chad-state/.github/workflows/. Installed by the
# `chad-state-bootstrap` script (one-shot setup from the operator host).
#
# Provider routing:
#   codex / opencode  → primary OPENAI_API_KEY, fallback NVIDIA_API_KEY
#                        (NVIDIA path uses integrate.api.nvidia.com/v1
#                        OpenAI-compatible endpoint + Nemotron model)
#   claude            → ANTHROPIC_API_KEY only (no NVIDIA fallback)
#
# So you can set just NVIDIA_API_KEY and codex/opencode kinds will run.
# claude kinds require ANTHROPIC_API_KEY since Anthropic-only.
#
# Optional GitHub Actions secrets in chad-state (set whichever you have):
#   OPENAI_API_KEY     — codex / opencode (primary path)
#   NVIDIA_API_KEY     — codex / opencode fallback; reuses Chad's nvapi-* key
#   ANTHROPIC_API_KEY  — claude (no fallback; Anthropic-only)
#   NVIDIA_BASE_URL    — override (default: https://integrate.api.nvidia.com/v1)
#   NVIDIA_DEFAULT_MODEL — override (default: nvidia/nemotron-3-super-120b-a12b)
#
# Add via:
#   gh secret set OPENAI_API_KEY     --repo tantodefi/chad-state --body "$KEY"
#   gh secret set NVIDIA_API_KEY     --repo tantodefi/chad-state --body "$KEY"
#   gh secret set ANTHROPIC_API_KEY  --repo tantodefi/chad-state --body "$KEY"

name: agent-job

on:
  workflow_dispatch:
    inputs:
      task_id:
        description: 'Spawn task UUID'
        required: true
        type: string
      branch:
        description: 'chad-spawn/<task_id> branch'
        required: true
        type: string

permissions:
  contents: write   # commit + push result back to the spawn branch

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout spawn branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 1

      - name: Validate spawn directory
        id: validate
        run: |
          set -e
          spawn_dir="spawns/${{ inputs.task_id }}"
          if [ ! -d "$spawn_dir" ]; then
            echo "ERROR: spawn directory not found: $spawn_dir" >&2
            exit 2
          fi
          for f in prompt.txt manifest.json; do
            if [ ! -f "$spawn_dir/$f" ]; then
              echo "ERROR: required file missing: $spawn_dir/$f" >&2
              exit 2
            fi
          done
          echo "spawn_dir=$spawn_dir" >> "$GITHUB_OUTPUT"

      - name: Read manifest
        id: manifest
        run: |
          set -e
          spawn_dir="${{ steps.validate.outputs.spawn_dir }}"
          binary=$(jq -r '.binary' "$spawn_dir/manifest.json")
          invocation=$(jq -r '.invocation' "$spawn_dir/manifest.json")
          kind=$(jq -r '.kind' "$spawn_dir/manifest.json")
          timeout_secs=$(jq -r '.timeout_secs' "$spawn_dir/manifest.json")
          echo "binary=$binary" >> "$GITHUB_OUTPUT"
          echo "invocation=$invocation" >> "$GITHUB_OUTPUT"
          echo "kind=$kind" >> "$GITHUB_OUTPUT"
          echo "timeout_secs=$timeout_secs" >> "$GITHUB_OUTPUT"
          echo "Manifest: kind=$kind binary=$binary invocation=$invocation timeout=${timeout_secs}s"

      - name: Install codex
        if: contains(steps.manifest.outputs.binary, 'codex')
        run: |
          npm install -g @openai/codex
          which codex
          codex --version || true

      - name: Install opencode
        if: contains(steps.manifest.outputs.binary, 'opencode')
        run: |
          npm install -g opencode
          which opencode

      - name: Install claude (if gha-substrate claude kind)
        if: contains(steps.manifest.outputs.binary, 'claude')
        run: |
          npm install -g @anthropic-ai/claude-code
          which claude

      - name: Resolve provider + endpoint
        id: provider
        env:
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          NVIDIA_API_KEY:    ${{ secrets.NVIDIA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NVIDIA_BASE_URL:      ${{ secrets.NVIDIA_BASE_URL }}
          NVIDIA_DEFAULT_MODEL: ${{ secrets.NVIDIA_DEFAULT_MODEL }}
        run: |
          set -e
          binary="${{ steps.manifest.outputs.binary }}"
          # Defaults for the NVIDIA fallback path
          nv_base="${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}"
          nv_model="${NVIDIA_DEFAULT_MODEL:-nvidia/nemotron-3-super-120b-a12b}"

          provider=""; reason=""
          case "$binary" in
            *codex*|*opencode*)
              if [ -n "$OPENAI_API_KEY" ]; then
                provider="openai"; reason="OPENAI_API_KEY set"
              elif [ -n "$NVIDIA_API_KEY" ]; then
                provider="nvidia"; reason="NVIDIA_API_KEY set (OPENAI_API_KEY absent)"
              else
                echo "::error::no key for $binary (need OPENAI_API_KEY or NVIDIA_API_KEY)"
                exit 3
              fi
              ;;
            *claude*)
              if [ -n "$ANTHROPIC_API_KEY" ]; then
                provider="anthropic"; reason="ANTHROPIC_API_KEY set"
              else
                echo "::error::claude needs ANTHROPIC_API_KEY (no NVIDIA fallback for claude — Anthropic-only)"
                exit 3
              fi
              ;;
            *)
              # Unknown binary: best-effort with whatever's set, NVIDIA preferred
              if [ -n "$NVIDIA_API_KEY" ]; then
                provider="nvidia"; reason="unknown binary; NVIDIA_API_KEY set"
              elif [ -n "$OPENAI_API_KEY" ]; then
                provider="openai"; reason="unknown binary; OPENAI_API_KEY set"
              elif [ -n "$ANTHROPIC_API_KEY" ]; then
                provider="anthropic"; reason="unknown binary; ANTHROPIC_API_KEY set"
              else
                echo "::error::no provider keys set"; exit 3
              fi
              ;;
          esac

          {
            echo "provider=$provider"
            echo "reason=$reason"
            echo "nvidia_base_url=$nv_base"
            echo "nvidia_default_model=$nv_model"
          } >> "$GITHUB_OUTPUT"
          echo "Provider routing: $binary → $provider ($reason)"

      - name: Run sub-agent
        id: run
        env:
          OPENAI_API_KEY:    ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NVIDIA_API_KEY:    ${{ secrets.NVIDIA_API_KEY }}
        run: |
          set +e
          spawn_dir="${{ steps.validate.outputs.spawn_dir }}"
          # Map sandbox-side absolute path to runner-side which-resolved path
          binary="${{ steps.manifest.outputs.binary }}"
          case "$binary" in
            /usr/local/bin/codex|/usr/bin/codex)       binary="$(which codex)"   ;;
            /usr/local/bin/opencode|/usr/bin/opencode) binary="$(which opencode)" ;;
            /usr/local/bin/claude|/usr/bin/claude)     binary="$(which claude)"   ;;
          esac

          # Apply provider routing from the previous step. NVIDIA path
          # uses the OpenAI-compatible endpoint at integrate.api.nvidia.com
          # so any binary that honors OPENAI_BASE_URL (codex, opencode)
          # transparently routes to NVIDIA inference.
          provider="${{ steps.provider.outputs.provider }}"
          if [ "$provider" = "nvidia" ]; then
            export OPENAI_BASE_URL="${{ steps.provider.outputs.nvidia_base_url }}"
            export OPENAI_API_KEY="$NVIDIA_API_KEY"
            export OPENAI_DEFAULT_MODEL="${{ steps.provider.outputs.nvidia_default_model }}"
            # codex / opencode also read these aliases in some versions
            export OPENAI_API_BASE="$OPENAI_BASE_URL"
            export OPENAI_MODEL="$OPENAI_DEFAULT_MODEL"
            echo "Routing $binary -> NVIDIA at $OPENAI_BASE_URL (model: $OPENAI_DEFAULT_MODEL)"
          fi
          if [ -z "$binary" ] || [ ! -x "$binary" ]; then
            echo '{"status":"failed","summary":"binary not installed on runner","exit_code":127}' \
              > "$spawn_dir/result.json"
            echo "exit_code=127" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          timeout="${{ steps.manifest.outputs.timeout_secs }}"
          [ -n "$timeout" ] && [ "$timeout" -gt 0 ] || timeout=600

          case "${{ steps.manifest.outputs.invocation }}" in
            prompt-stdin)
              timeout --kill-after=10 "${timeout}s" "$binary" \
                < "$spawn_dir/prompt.txt" \
                > "$spawn_dir/stdout.log" \
                2> "$spawn_dir/stderr.log"
              exit_code=$?
              ;;
            prompt-arg)
              prompt_body="$(cat "$spawn_dir/prompt.txt")"
              timeout --kill-after=10 "${timeout}s" "$binary" \
                "$prompt_body" \
                > "$spawn_dir/stdout.log" \
                2> "$spawn_dir/stderr.log"
              exit_code=$?
              ;;
            *)
              echo "Unsupported invocation style for gha substrate: ${{ steps.manifest.outputs.invocation }}" \
                > "$spawn_dir/stderr.log"
              exit_code=2
              ;;
          esac

          # Extract last non-empty stdout line; if it's JSON, parse it as the
          # result. Otherwise synthesize a fallback. All shell-string values
          # pass through env (no quote-injection from sub-agent stdout).
          AGENT_LAST="$(awk 'NF{line=$0} END{print line}' "$spawn_dir/stdout.log" 2>/dev/null)" \
          AGENT_TASK_ID="${{ inputs.task_id }}" \
          AGENT_KIND="${{ steps.manifest.outputs.kind }}" \
          AGENT_EXIT="$exit_code" \
          AGENT_PROVIDER="${{ steps.provider.outputs.provider }}" \
          AGENT_OUT="$spawn_dir/result.json" \
          python3 <<'PY'
          import json, os
          last = os.environ.get("AGENT_LAST", "")
          exit_code = int(os.environ["AGENT_EXIT"])
          parsed = None
          if last:
              try:
                  v = json.loads(last)
                  if isinstance(v, dict):
                      parsed = v
              except Exception:
                  parsed = None
          if parsed is None:
              parsed = {
                  "summary": "sub-agent did not emit a JSON summary on the last line",
              }
          parsed.setdefault("status", "failed" if exit_code != 0 else "done")
          parsed.update({
              "task_id":   os.environ["AGENT_TASK_ID"],
              "kind":      os.environ["AGENT_KIND"],
              "exit_code": exit_code,
              "substrate": "gha",
              "provider":  os.environ.get("AGENT_PROVIDER", "unknown"),
          })
          with open(os.environ["AGENT_OUT"], "w") as f:
              json.dump(parsed, f, indent=2)
          PY
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"

      - name: Commit result back to spawn branch
        run: |
          set -e
          spawn_dir="${{ steps.validate.outputs.spawn_dir }}"
          git config user.name "Chad GHA Runner"
          git config user.email "supachad+gha@proton.me"
          git add "$spawn_dir/"
          git commit -m "chad-spawn(${{ inputs.task_id }}): result (exit ${{ steps.run.outputs.exit_code }})"
          git push origin "${{ inputs.branch }}"

      - name: Job summary
        if: always()
        run: |
          spawn_dir="${{ steps.validate.outputs.spawn_dir }}"
          {
            echo "# Spawn ${{ inputs.task_id }}"
            echo
            echo "**Kind:** ${{ steps.manifest.outputs.kind }}"
            echo "**Binary:** ${{ steps.manifest.outputs.binary }}"
            echo "**Provider:** ${{ steps.provider.outputs.provider }} — ${{ steps.provider.outputs.reason }}"
            echo "**Branch:** \`${{ inputs.branch }}\`"
            echo "**Exit:** ${{ steps.run.outputs.exit_code }}"
            echo
            if [ -f "$spawn_dir/result.json" ]; then
              echo '## Result'
              echo
              echo '```json'
              cat "$spawn_dir/result.json"
              echo
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
